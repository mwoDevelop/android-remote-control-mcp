import org.gradle.api.tasks.testing.Test

// Official-upstream mirror builds deliberately receive no account or device secrets. The live ngrok
// integration test requires a real account token, so only that class is excluded from execution. It is
// still compiled by the Android unit-test task; all other unit, integration and privacy tests remain active.
allprojects {
    tasks.withType(Test).configureEach {
        filter {
            excludeTestsMatching(
                "com.danielealbano.androidremotecontrolmcp.integration.NgrokTunnelIntegrationTest"
            )
        }
    }
}
