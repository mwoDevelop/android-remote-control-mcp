name: ARCP channel release

run-name: >-
  ARCP ${{ inputs.channel }} r${{ inputs.revision }}
  ${{ inputs.publish && 'publish' || 'dry-run' }}
  [${{ inputs.request_id || github.run_id }}]

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Reviewed local integration channel
        required: true
        type: choice
        options:
          - edge
          - stable
      revision:
        description: Repair revision for this exact source identity
        required: true
        default: '1'
        type: string
      publish:
        description: Allocate a version code and publish an immutable GitHub Release
        required: true
        default: false
        type: boolean
      request_id:
        description: Optional validated caller correlation ID; blank UI runs use the GitHub run ID
        required: false
        default: ''
        type: string
      expected_source_sha:
        description: Optional pinned full official-upstream SHA; blank resolves latest when the run starts
        required: false
        default: ''
        type: string
      expected_local_sha:
        description: Optional pinned full owner-channel SHA; blank resolves latest when the run starts
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: arcp-channel-publication
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve pinned source identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      upstream_label: ${{ steps.resolve.outputs.upstream_label }}
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      local_sha: ${{ steps.resolve.outputs.local_sha }}
      version_name: ${{ steps.resolve.outputs.version_name }}
    steps:
      - name: Checkout trusted automation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Configure read-only official upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/danielealbano/android-remote-control-mcp.git
          git remote set-url --push upstream DISABLED

      - name: Resolve both immutable source identities and ledger allocation
        id: resolve
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          REVISION: ${{ inputs.revision }}
          REQUEST_ID: ${{ inputs.request_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_LOCAL_SHA: ${{ inputs.expected_local_sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[1-9][0-9]{0,3}$ ]] || {
            echo '::error::revision must be an integer from 1 through 9999'; exit 1;
          }
          [[ -z "$REQUEST_ID" || "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,79}$ ]] || {
            echo '::error::request_id must be 8-80 allowlisted ASCII characters'; exit 1;
          }
          [[ -z "$EXPECTED_SOURCE_SHA" || "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo '::error::expected_source_sha must be blank or a full SHA'; exit 1;
          }
          [[ -z "$EXPECTED_LOCAL_SHA" || "$EXPECTED_LOCAL_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo '::error::expected_local_sha must be blank or a full SHA'; exit 1;
          }
          channel_args=(channel-info "--latest-$CHANNEL")
          [[ -z "$EXPECTED_SOURCE_SHA" ]] || channel_args+=(--expected-source-sha "${EXPECTED_SOURCE_SHA,,}")
          [[ -z "$EXPECTED_LOCAL_SHA" ]] || channel_args+=(--expected-local-sha "${EXPECTED_LOCAL_SHA,,}")
          channel_json="$(scripts/sync-build-deploy.sh "${channel_args[@]}")"
          upstream_label="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).upstream_label)' "$channel_json")"
          upstream_sha="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).upstream_sha)' "$channel_json")"
          local_sha="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).local_sha)' "$channel_json")"
          version_name="arcp.${CHANNEL}.${upstream_label#v}.${local_sha:0:12}.r${REVISION}"
          {
            printf 'channel=%s\n' "$CHANNEL"
            printf 'upstream_label=%s\n' "$upstream_label"
            printf 'upstream_sha=%s\n' "$upstream_sha"
            printf 'local_sha=%s\n' "$local_sha"
            printf 'version_name=%s\n' "$version_name"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'request_id=%s\n' "${REQUEST_ID:-manual-$GITHUB_RUN_ID}"
            printf 'upstream_sha=%s\n' "$upstream_sha"
            printf 'local_sha=%s\n' "$local_sha"
          } >> "$GITHUB_STEP_SUMMARY"

  preview-version:
    name: Preview version identity (read-only)
    if: ${{ !inputs.publish }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout trusted automation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Preview unreserved version identity
        id: version
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          UPSTREAM_LABEL: ${{ needs.resolve.outputs.upstream_label }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          LOCAL_SHA: ${{ needs.resolve.outputs.local_sha }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          scripts/arcp-version-ledger.sh allocate --channel "$CHANNEL" --upstream-label "$UPSTREAM_LABEL" \
            --upstream-sha "$UPSTREAM_SHA" --local-sha "$LOCAL_SHA" --revision "$REVISION" > ledger-entry.json
          printf 'version_code=%s\n' \
            "$(node -e 'process.stdout.write(String(require("./ledger-entry.json").version_code))')" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' \
            "$(node -e 'process.stdout.write(require("./ledger-entry.json").release_tag)')" >> "$GITHUB_OUTPUT"

      - name: Upload exact preview ledger entry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcp-ledger-${{ github.run_id }}
          path: ledger-entry.json
          if-no-files-found: error
          retention-days: 3

  reserve-version:
    name: Reserve version identity for publication
    if: ${{ inputs.publish }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: upstream-releases
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Require publication activation
        env:
          ENABLE_PUBLICATION: ${{ vars.ENABLE_ARCP_RELEASE_PUBLISHING }}
        run: |
          [[ "$ENABLE_PUBLICATION" == true ]] || {
            echo '::error::Publication was requested but ENABLE_ARCP_RELEASE_PUBLISHING is not true'; exit 1;
          }

      - name: Checkout trusted automation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Reserve immutable version identity
        id: version
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          UPSTREAM_LABEL: ${{ needs.resolve.outputs.upstream_label }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          LOCAL_SHA: ${{ needs.resolve.outputs.local_sha }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          scripts/arcp-version-ledger.sh allocate --channel "$CHANNEL" --upstream-label "$UPSTREAM_LABEL" \
            --upstream-sha "$UPSTREAM_SHA" --local-sha "$LOCAL_SHA" --revision "$REVISION" --apply > ledger-entry.json
          printf 'version_code=%s\n' \
            "$(node -e 'process.stdout.write(String(require("./ledger-entry.json").version_code))')" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' \
            "$(node -e 'process.stdout.write(require("./ledger-entry.json").release_tag)')" >> "$GITHUB_OUTPUT"

      - name: Upload exact reserved ledger entry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcp-ledger-${{ github.run_id }}
          path: ledger-entry.json
          if-no-files-found: error
          retention-days: 3

  build:
    name: Secretless static qualification
    needs: [resolve, preview-version, reserve-version]
    if: >-
      ${{ always() && needs.resolve.result == 'success' &&
          (needs.preview-version.result == 'success' || needs.reserve-version.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout trusted automation source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'

      - name: Install pinned Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Configure read-only official upstream and prove secretless boundary
        shell: bash
        run: |
          set -euo pipefail
          for variable in NGROK_AUTHTOKEN RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [[ -z "${!variable:-}" ]] || { echo "::error::Forbidden secret in static build: $variable"; exit 1; }
          done
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/danielealbano/android-remote-control-mcp.git
          git remote set-url --push upstream DISABLED

      - name: Build exact GMS and FOSS unsigned release APKs
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          LOCAL_SHA: ${{ needs.resolve.outputs.local_sha }}
          VERSION_CODE: ${{ needs.reserve-version.outputs.version_code || needs.preview-version.outputs.version_code }}
          VERSION_NAME: ${{ needs.resolve.outputs.version_name }}
        run: |
          set -euo pipefail
          common=("--latest-$CHANNEL" --unsigned-release --expected-source-sha "$UPSTREAM_SHA" \
            --expected-local-sha "$LOCAL_SHA" --version-code "$VERSION_CODE" --version-name "$VERSION_NAME")
          scripts/sync-build-deploy.sh build "${common[@]}" --variant gmsRelease
          scripts/sync-build-deploy.sh build "${common[@]}" --variant fossRelease
          output="build/arcp-pre-sign-$CHANNEL"
          mkdir -p "$output"
          find "build/channels/$CHANNEL" -maxdepth 1 -type f \
            \( -name 'manifest-*.json' -o -name '*-unsigned.apk' \) -exec cp {} "$output/" \;
          [[ "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq 4 ]]

      - name: Upload short-lived unsigned allowlist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcp-pre-sign-${{ needs.resolve.outputs.channel }}-${{ github.run_id }}
          path: build/arcp-pre-sign-${{ needs.resolve.outputs.channel }}/*
          if-no-files-found: error
          retention-days: 2

  live-ngrok:
    name: Protected live ngrok qualification
    needs: [resolve, preview-version, reserve-version]
    if: >-
      ${{ always() && needs.resolve.result == 'success' &&
          (needs.preview-version.result == 'success' || needs.reserve-version.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: arcp-live-tests
    steps:
      - name: Checkout exact local integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.local_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Rust host toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build ngrok host bridge and run only the live integration class
        shell: bash
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          LOCAL_SHA: ${{ needs.resolve.outputs.local_sha }}
        run: |
          set -euo pipefail
          [[ -n "$NGROK_AUTHTOKEN" ]]
          (cd vendor/ngrok-java && \
            mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q && \
            mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q)
          (cd vendor/ngrok-java/ngrok-java-native/target/classes && jar cf ../ngrok-java-native-classes.jar com/)
          (cd vendor/ngrok-java/ngrok-java-native && cargo build --release)
          (cd vendor/ngrok-java/ngrok-java-native/target/release && \
            jar cf ../ngrok-java-native-host.jar libngrok_java.so)
          ./gradlew :app:testGmsDebugUnitTest --tests \
            com.danielealbano.androidremotecontrolmcp.integration.NgrokTunnelIntegrationTest
          node -e '
            const fs=require("fs"); const [channel,upstreamSha,localSha]=process.argv.slice(1);
            fs.writeFileSync("live-test-evidence.json",JSON.stringify({schema_version:1,type:"arcp_live_test",
              passed:true,channel,upstream_sha:upstreamSha,local_sha:localSha},null,2)+"\n");
          ' "$CHANNEL" "$UPSTREAM_SHA" "$LOCAL_SHA"

      - name: Upload live-test evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcp-live-${{ needs.resolve.outputs.channel }}-${{ github.run_id }}
          path: live-test-evidence.json
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign and independently verify release bundle
    needs: [resolve, preview-version, reserve-version, build, live-ngrok]
    if: >-
      ${{ always() && needs.resolve.result == 'success' && needs.build.result == 'success' &&
          needs.live-ngrok.result == 'success' &&
          (needs.preview-version.result == 'success' || needs.reserve-version.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: upstream-releases
    steps:
      - name: Checkout exact trusted automation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Download closed input bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: arcp-*-${{ github.run_id }}
          path: build/inputs

      - name: Sign and independently verify
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/danielealbano/android-remote-control-mcp.git
          git remote set-url --push upstream DISABLED
          secret_dir="$(mktemp -d "$RUNNER_TEMP/arcp-sign.XXXXXX")"
          cleanup() { rm -rf -- "$secret_dir"; }
          trap cleanup EXIT INT TERM
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$secret_dir/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > "$secret_dir/store-password"
          printf '%s' "$RELEASE_KEY_PASSWORD" > "$secret_dir/key-password"
          chmod 600 "$secret_dir"/*
          key_alias="$RELEASE_KEY_ALIAS"
          unset RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD
          output="build/arcp-release-$CHANNEL"
          scripts/sign-arcp-channel-release.sh \
            --input-dir "build/inputs/arcp-pre-sign-$CHANNEL-$GITHUB_RUN_ID" \
            --ledger-entry "build/inputs/arcp-ledger-$GITHUB_RUN_ID/ledger-entry.json" \
            --live-test-evidence "build/inputs/arcp-live-$CHANNEL-$GITHUB_RUN_ID/live-test-evidence.json" \
            --output-dir "$output" --keystore "$secret_dir/release.jks" \
            --store-password-file "$secret_dir/store-password" --key-alias "$key_alias" \
            --key-password-file "$secret_dir/key-password" \
            --expected-certificate-sha256 "$EXPECTED_CERTIFICATE_SHA256" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-source-sha "$GITHUB_SHA"
          cleanup
          trap - EXIT INT TERM
          scripts/publish-arcp-channel-release.sh --release-dir "$output" \
            --repo "$GITHUB_REPOSITORY"

      - name: Record validated dry-run result
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          REQUEST_ID: ${{ inputs.request_id }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          LOCAL_SHA: ${{ needs.resolve.outputs.local_sha }}
        run: |
          node -e '
            const fs=require("fs"), [out,manifestPath,requestId,runId,channel,upstreamSha,localSha]=process.argv.slice(1);
            const manifest=JSON.parse(fs.readFileSync(manifestPath,"utf8"));
            fs.writeFileSync(out,JSON.stringify({schema_version:1,type:"arcp_release_result",
              status:"dry_run_validated",request_id:requestId||("manual-"+runId),run_id:Number(runId),channel,
              upstream_sha:upstreamSha,local_sha:localSha,release_tag:manifest.release_tag},null,2)+"\n");
          ' release-result.json "build/arcp-release-$CHANNEL/release-manifest.json" "$REQUEST_ID" \
            "$GITHUB_RUN_ID" "$CHANNEL" "$UPSTREAM_SHA" "$LOCAL_SHA"

      - name: Upload signed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcp-signed-${{ needs.resolve.outputs.channel }}-${{ github.run_id }}
          path: build/arcp-release-${{ needs.resolve.outputs.channel }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload dry-run result
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcp-result-${{ github.run_id }}
          path: release-result.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable release
    needs: [resolve, reserve-version, sign]
    # preview-version is intentionally skipped for a publication. Its skipped result is an
    # ancestor of sign and can otherwise propagate through the implicit success() guard,
    # causing this job to be skipped even though every direct publication dependency passed.
    if: >-
      ${{ always() && inputs.publish &&
          needs.resolve.result == 'success' && needs.reserve-version.result == 'success' &&
          needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    environment: upstream-releases
    steps:
      - name: Require publication activation
        env:
          ENABLE_PUBLICATION: ${{ vars.ENABLE_ARCP_RELEASE_PUBLISHING }}
        run: |
          [[ "$ENABLE_PUBLICATION" == true ]] || {
            echo '::error::Publication was requested but ENABLE_ARCP_RELEASE_PUBLISHING is not true'; exit 1;
          }

      - name: Checkout exact trusted automation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Download signed closed bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arcp-signed-${{ needs.resolve.outputs.channel }}-${{ github.run_id }}
          path: build/arcp-release-${{ needs.resolve.outputs.channel }}

      - name: Publish and record result
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          REQUEST_ID: ${{ inputs.request_id }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          LOCAL_SHA: ${{ needs.resolve.outputs.local_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/danielealbano/android-remote-control-mcp.git
          git remote set-url --push upstream DISABLED
          output="build/arcp-release-$CHANNEL"
          release_tag="$(node -e '
            const fs=require("fs");
            process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).release_tag);
          ' "$output/release-manifest.json")"
          status=published
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            status=existing_verified_noop
          fi
          scripts/publish-arcp-channel-release.sh --release-dir "$output" \
            --repo "$GITHUB_REPOSITORY" --apply
          node -e '
            const fs=require("fs"), [out,status,requestId,runId,channel,upstreamSha,localSha,tag]=process.argv.slice(1);
            fs.writeFileSync(out,JSON.stringify({schema_version:1,type:"arcp_release_result",status,
              request_id:requestId||("manual-"+runId),run_id:Number(runId),channel,upstream_sha:upstreamSha,
              local_sha:localSha,release_tag:tag},null,2)+"\n");
          ' release-result.json "$status" "$REQUEST_ID" "$GITHUB_RUN_ID" "$CHANNEL" "$UPSTREAM_SHA" \
            "$LOCAL_SHA" "$release_tag"

      - name: Upload publication result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcp-result-${{ github.run_id }}
          path: release-result.json
          if-no-files-found: error
          retention-days: 30
