name: Official upstream channel mirrors

on:
  schedule:
    - cron: '23 3,15 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Official upstream source channel
        required: true
        type: choice
        options:
          - stable
          - edge
      publish:
        description: Publish after signing (also requires ENABLE_UPSTREAM_RELEASE_PUBLISHING=true)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-untrusted-upstream:
    name: Build unsigned ${{ matrix.channel }} bundle
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: upstream-mirror-build-${{ matrix.channel }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'schedule' && '["stable","edge"]' || format('["{0}"]', inputs.channel)) }}
    steps:
      - name: Checkout trusted automation source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Prove secretless checkout boundary
        shell: bash
        run: |
          set -euo pipefail
          for variable in NGROK_AUTHTOKEN RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD GH_TOKEN GITHUB_TOKEN; do
            if [[ -n "${!variable:-}" ]]; then
              echo "::error::Forbidden secret-bearing environment variable is present: $variable"
              exit 1
            fi
          done
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo '::error::Checkout persisted a Git authorization header'
            exit 1
          fi

      - name: Configure official upstream source remote
        shell: bash
        run: |
          set -euo pipefail
          upstream_url='https://github.com/danielealbano/android-remote-control-mcp.git'
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$upstream_url"
          git remote set-url --push upstream DISABLED
          [[ "$(git remote get-url upstream)" == "$upstream_url" ]]
          [[ "$(git remote get-url --push upstream)" == DISABLED ]]

      - name: Build qualified unsigned GMS and FOSS Release APKs
        id: build
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          channel_flag="--latest-$CHANNEL"
          scripts/sync-build-deploy.sh build "$channel_flag" --variant gmsRelease --unsigned-release
          gms_manifest="$(find "build/channels/$CHANNEL" -maxdepth 1 -type f -name 'manifest-gmsRelease-*.json' -print -quit)"
          [[ -n "$gms_manifest" ]]
          source_sha="$(node -e 'const m=require(process.argv[1]);process.stdout.write(m.source_sha)' "./$gms_manifest")"
          scripts/sync-build-deploy.sh build "$channel_flag" --variant fossRelease --unsigned-release \
            --expected-source-sha "$source_sha"
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"

      - name: Collect exact pre-sign allowlist
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          output="build/upstream-artifact-$CHANNEL"
          mkdir -p "$output"
          for variant in gmsRelease fossRelease; do
            cp "build/channels/$CHANNEL/manifest-${variant}-${short_sha}.json" "$output/"
            cp "build/channels/$CHANNEL/android-remote-control-mcp-$CHANNEL-${variant}-${short_sha}-unsigned.apk" "$output/"
          done
          [[ "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq 4 ]]

      - name: Upload short-lived unsigned bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-unsigned-${{ matrix.channel }}-${{ github.run_id }}
          path: build/upstream-artifact-${{ matrix.channel }}/*
          if-no-files-found: error
          retention-days: 2

  sign-and-publish:
    name: Sign and qualify ${{ matrix.channel }} bundle
    needs: build-untrusted-upstream
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment: upstream-releases
    concurrency:
      group: upstream-mirror-publish-${{ matrix.channel }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'schedule' && '["stable","edge"]' || format('["{0}"]', inputs.channel)) }}
    steps:
      - name: Checkout the exact trusted fork workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Download unsigned bundle only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-unsigned-${{ matrix.channel }}-${{ github.run_id }}
          path: build/upstream-input-${{ matrix.channel }}

      - name: Sign, independently verify and publish or dry-run
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
          ENABLE_PUBLICATION: ${{ vars.ENABLE_UPSTREAM_RELEASE_PUBLISHING }}
          REQUEST_PUBLICATION: ${{ github.event_name == 'schedule' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          secret_dir="$(mktemp -d "$RUNNER_TEMP/arcp-signing-secret.XXXXXX")"
          cleanup() { rm -rf -- "$secret_dir"; }
          trap cleanup EXIT INT TERM
          [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_KEYSTORE_PASSWORD" &&
             -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" &&
             "$EXPECTED_CERTIFICATE_SHA256" =~ ^([0-9A-Fa-f]{2}:?){32}$ ]]
          key_alias="$RELEASE_KEY_ALIAS"
          publication_token="$GH_TOKEN"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d >"$secret_dir/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" >"$secret_dir/store-password"
          printf '%s' "$RELEASE_KEY_PASSWORD" >"$secret_dir/key-password"
          unset RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD GH_TOKEN
          output="build/upstream-release-$CHANNEL"
          scripts/sign-upstream-channel-release.sh \
            --input-dir "build/upstream-input-$CHANNEL" \
            --output-dir "$output" \
            --keystore "$secret_dir/release.jks" \
            --store-password-file "$secret_dir/store-password" \
            --key-alias "$key_alias" \
            --key-password-file "$secret_dir/key-password" \
            --expected-certificate-sha256 "$EXPECTED_CERTIFICATE_SHA256" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-source-sha "$GITHUB_SHA"
          cleanup
          trap - EXIT INT TERM
          if [[ "$REQUEST_PUBLICATION" == true && "$ENABLE_PUBLICATION" == true ]]; then
            GH_TOKEN="$publication_token" scripts/publish-upstream-channel-release.sh \
              --release-dir "$output" --repo "$GITHUB_REPOSITORY" --apply
          else
            if [[ "$REQUEST_PUBLICATION" == true ]]; then
              echo '::warning::Publication was requested but ENABLE_UPSTREAM_RELEASE_PUBLISHING is not true; running dry-run.'
            fi
            scripts/publish-upstream-channel-release.sh --release-dir "$output" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload signed dry-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-signed-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            build/upstream-release-${{ matrix.channel }}/*.apk
            build/upstream-release-${{ matrix.channel }}/release-manifest.json
            build/upstream-release-${{ matrix.channel }}/release-notes.md
          if-no-files-found: error
          retention-days: 3

      - name: Remove any remaining signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 \
            \( -name 'arcp-signing-secret.*' -o -name 'arcp-upstream-sign.*' \) -exec rm -rf -- {} +
